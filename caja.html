<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Caja · Pollos Colorado</title>
<meta name="theme-color" content="#120E0B">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Caja de mostrador (DEMO): menú a la izquierda, ticket a la derecha. Pensada para tablet horizontal. */
:root{
  --carbon:#120E0B; --brasa:#1D1712; --brasa-2:#271F18; --ceniza:#3A2F26;
  --hueso:#F5ECE1; --humo:#B9A999; --naranja:#F2711C; --ambar:#FFA24C;
  --verde:#2FB36A; --rojo:#E5484D; --azul:#3B82F6;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--carbon);color:var(--hueso);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px)}
/* Barra superior */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--brasa);border-bottom:1px solid var(--ceniza)}
.marca{display:flex;align-items:center;gap:8px}
.marca b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.02em}
.marca small{display:block;font-family:var(--label);font-weight:700;letter-spacing:.24em;color:var(--naranja);font-size:10px}
.demo{font-family:var(--label);font-weight:700;letter-spacing:.12em;font-size:12px;color:var(--carbon);background:var(--ambar);border-radius:6px;padding:3px 8px}
.vistas{margin-left:auto;display:flex;background:var(--carbon);border-radius:999px;padding:4px;gap:4px}
.vistas button{font-family:var(--label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;padding:8px 16px;border-radius:999px;color:var(--humo)}
.vistas button[aria-pressed="true"]{background:var(--naranja);color:var(--carbon)}
.reloj{font-family:var(--display);font-size:20px;color:var(--humo);min-width:84px;text-align:right}
/* Vista venta */
.venta{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,34vw,380px);min-height:0}
.menu{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--ceniza)}
.cats{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;flex:none}
.cats button{flex:none;font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;padding:8px 16px;border-radius:12px;background:var(--brasa);border:1.5px solid var(--ceniza);color:var(--humo)}
.cats button[aria-pressed="true"]{border-color:var(--naranja);color:var(--hueso);background:color-mix(in srgb,var(--naranja) 18%,var(--brasa))}
.grid{flex:1;overflow-y:auto;padding:2px 14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;align-content:start;grid-auto-rows:max-content}
.prod{position:relative;display:flex;flex-direction:column;background:var(--brasa);border:1.5px solid var(--ceniza);border-radius:14px;overflow:hidden;text-align:left;transition:transform .08s}
.prod:active{transform:scale(.97)}
.prod .ph{height:96px;flex:none;background:var(--brasa-2) center/cover no-repeat}
@media (min-width:1200px) and (min-height:700px){.prod .ph{height:130px}}
.prod .t{padding:6px 9px 8px;display:flex;flex-direction:column;gap:1px;flex:1;justify-content:space-between}
.prod .t b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.08;text-transform:uppercase;letter-spacing:.01em}
.prod .t span{font-family:var(--display);font-size:17px;color:var(--ambar);white-space:nowrap}
.prod .cnt{position:absolute;top:6px;right:6px;min-width:26px;height:26px;border-radius:999px;background:var(--naranja);color:var(--carbon);font-weight:800;display:grid;place-items:center;padding:0 6px}
.prod.off{opacity:.4;pointer-events:none}
.prod.off::after{content:"AGOTADO";position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);font-family:var(--display);font-size:22px;color:var(--rojo);border:3px solid var(--rojo);padding:2px 10px;border-radius:6px}
/* Ticket lateral */
.ticket{display:flex;flex-direction:column;min-height:0;background:var(--brasa)}
.ticket-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.ticket-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px}
.ticket-h .folio{font-family:var(--label);font-weight:700;letter-spacing:.08em;color:var(--humo)}
.lineas{flex:1;overflow-y:auto;padding:0 16px}
.vacio{color:var(--humo);text-align:center;padding:40px 10px;font-size:15px}
.vacio svg{display:block;margin:0 auto 10px;opacity:.5}
.ln{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px dashed var(--ceniza)}
.ln b{font-weight:700}
.ln .p{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.ln i{grid-column:1/-1;font-style:normal;font-size:13px;color:var(--humo)}
.ln .ctl{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin-top:4px}
.ln .ctl button{width:34px;height:34px;border-radius:10px;background:var(--carbon);border:1px solid var(--ceniza);font-size:20px;font-weight:700;color:var(--naranja)}
.ln .ctl span{min-width:26px;text-align:center;font-weight:700}
.ln .ctl .del{margin-left:auto;width:auto;padding:0 10px;font-size:13px;color:var(--rojo);border-color:color-mix(in srgb,var(--rojo) 40%,var(--ceniza))}
.pie{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ceniza);display:grid;gap:10px}
.canal{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.canal button{padding:9px;border-radius:10px;border:1.5px solid var(--ceniza);font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--humo)}
.canal button[aria-pressed="true"]{border-color:var(--naranja);color:var(--hueso)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot span{font-family:var(--label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--humo)}
.tot b{font-family:var(--display);font-weight:400;font-size:40px;font-variant-numeric:tabular-nums}
.cobrar{padding:16px;border-radius:14px;background:var(--naranja);color:var(--carbon);font-family:var(--label);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.cobrar:disabled{background:var(--brasa-2);color:var(--humo)}
.limpiar{font-size:14px;color:var(--humo);text-decoration:underline}
/* Modales */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.veil.open{display:flex}
.modal{width:100%;max-width:620px;max-height:100%;overflow-y:auto;background:var(--brasa);border:1px solid var(--ceniza);border-radius:18px;padding:20px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.modal h3{margin:0;font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase}
.x{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ceniza);display:grid;place-items:center;flex:none}
.sub{color:var(--humo);margin:0 0 10px}
.f{display:block;font-weight:700;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--ceniza);background:var(--carbon);font-weight:600}
.chip[aria-pressed="true"]{background:var(--naranja);border-color:var(--naranja);color:var(--carbon)}
.chip:disabled{opacity:.35;text-decoration:line-through}
.pieza{background:var(--carbon);border:1px solid var(--ceniza);border-radius:12px;padding:10px 12px;margin-top:8px}
.pieza-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--label);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.modo{display:inline-flex;background:var(--brasa-2);border-radius:999px;padding:3px}
.modo button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--humo)}
.modo button[aria-pressed="true"]{background:var(--hueso);color:var(--carbon)}
.mitad{display:block;font-size:13px;font-weight:700;color:var(--ambar);margin:8px 0 6px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--ceniza);border-radius:12px;background:var(--carbon)}
.stepper button{width:48px;height:48px;font-size:24px;font-weight:700;color:var(--naranja)}
.stepper span{min-width:36px;text-align:center;font-weight:700;font-size:18px}
.acts{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:-20px;background:var(--brasa);padding:10px 0 4px;z-index:1}
.btn{flex:1;padding:15px;border-radius:12px;font-family:var(--label);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
.btn.main{background:var(--naranja);color:var(--carbon)}
.btn.ghost{border:1.5px solid var(--ceniza)}
.btn.verde{background:var(--verde);color:#06210f}
.btn:disabled{background:var(--brasa-2);color:var(--humo)}
input[type=text],input[type=number]{width:100%;background:var(--carbon);border:1.5px solid var(--ceniza);border-radius:12px;padding:13px;color:var(--hueso);font:inherit;font-size:18px}
.pagos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pago{padding:16px 8px;border-radius:14px;border:1.5px solid var(--ceniza);background:var(--carbon);font-family:var(--label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.pago[aria-pressed="true"]{border-color:var(--naranja);background:color-mix(in srgb,var(--naranja) 18%,var(--carbon))}
.billetes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.billetes button{padding:10px 14px;border-radius:10px;border:1.5px solid var(--ceniza);background:var(--carbon);font-weight:700}
.cambio{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--carbon)}
.cambio b{font-family:var(--display);font-weight:400;font-size:32px;color:var(--verde)}
.cambio.falta b{color:var(--rojo)}
.gran-total{font-family:var(--display);font-size:46px;text-align:center;margin:4px 0 8px}
/* Ticket impreso (vista previa) */
.papel{width:300px;margin:6px auto 0;background:#fff;color:#111;font-family:"Courier New",monospace;font-size:13px;padding:16px 14px 20px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.4);position:relative}
.papel::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,#fff 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,#fff 0) 0 0/12px 8px}
.papel .c{text-align:center}
.papel .logo-tk{display:flex;justify-content:center;margin:0 0 6px}
.papel .logo-tk svg{width:200px;height:auto}
.papel .lg{font-family:var(--display);font-size:24px;letter-spacing:.04em}
.papel hr{border:0;border-top:1px dashed #888;margin:8px 0}
.papel .r{display:flex;justify-content:space-between;gap:8px}
.papel .d{font-size:11px;color:#444;padding-left:10px}
.papel .t{font-size:16px;font-weight:700}
/* Corte */
.corte{overflow-y:auto;padding:18px 20px 30px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--brasa);border:1px solid var(--ceniza);border-radius:14px;padding:14px}
.kpi span{display:block;font-family:var(--label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--humo);font-size:13px}
.kpi b{font-family:var(--display);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.caja{background:var(--brasa);border:1px solid var(--ceniza);border-radius:14px;padding:14px}
.caja h4{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:20px;text-transform:uppercase}
.barra{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;margin:8px 0;font-size:15px}
.barra .b{height:14px;border-radius:7px;background:var(--brasa-2);overflow:hidden}
.barra .b i{display:block;height:100%;border-radius:7px}
.barra .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-family:var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--humo);font-size:13px;padding:6px 4px;border-bottom:1px solid var(--ceniza)}
td{padding:8px 4px;border-bottom:1px solid var(--ceniza);font-variant-numeric:tabular-nums}
.tag{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--brasa-2)}
.prox{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.prox button{padding:12px 16px;border-radius:12px;border:1.5px dashed var(--ceniza);color:var(--humo);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--hueso);color:var(--carbon);padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90%;text-align:center}
.toast.ver{opacity:1;transform:translate(-50%,0)}
@media (orientation:portrait) and (max-width:900px), (max-width:640px){
.toast{bottom:auto;top:76px}
  .venta{grid-template-columns:minmax(0,1fr)}
  .ticket{position:fixed;left:0;right:0;bottom:0;max-height:44%;border-top:2px solid var(--naranja);z-index:5}
  .grid{padding-bottom:46vh}
  .gira{display:block!important}
  .kpis{grid-template-columns:1fr 1fr}.dos{grid-template-columns:1fr}
  .reloj{display:none}
}
/* Pantallas bajitas (tablet acostada): todo más compacto */
@media (max-height:640px){
  .top{padding:6px 14px;gap:10px}
  .marca b{font-size:21px}.marca img{width:32px!important;height:32px!important}
  .vistas button{padding:6px 12px;font-size:14px}.reloj{font-size:17px}
  .cats{padding:8px 14px}.cats button{padding:6px 14px;font-size:15px}
  .ticket-h{padding:10px 14px 6px}.ticket-h h2{font-size:22px}
  .lineas{padding:0 14px}.ln{padding:7px 0}.ln .ctl button{width:30px;height:30px;font-size:18px}
  .pie{padding:8px 14px calc(10px + env(safe-area-inset-bottom,0px));gap:7px}
  .canal button{padding:6px;font-size:14px}
  .tot b{font-size:30px}.cobrar{padding:11px;font-size:19px}
  .vacio{padding:20px 10px}
  .modal{padding:14px 16px}.modal h3{font-size:24px}.f{margin:10px 0 6px}
  .chip{padding:8px 12px}.stepper button{width:42px;height:42px}.btn{padding:12px}.acts{margin-top:12px}
}
.top{min-width:0}.vistas{flex:none}
@media (max-width:600px){.marca>div{display:none}.vistas button{padding:7px 12px;font-size:14px}}
.gira{display:none;font-size:12px;color:var(--humo);text-align:center;padding:0 14px 6px}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="marca"><img src="logo.webp" width="36" height="36" alt="" style="border-radius:50%;display:block"><div><b>COLORADO</b><small>CAJA · MOSTRADOR</small></div></div>
    <span class="demo">DEMO</span>
    <nav class="vistas"><button id="vVenta" aria-pressed="true">Venta</button><button id="vCorte" aria-pressed="false">Corte del día</button></nav>
    <div class="reloj" id="reloj"></div>
  </header>

  <section class="venta" id="pVenta">
    <div class="menu">
      <div class="cats" id="cats"></div>
      <p class="gira">Tip: gira la tablet en horizontal para ver todo mejor.</p>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="ticket">
      <div class="ticket-h"><h2>Venta</h2><span class="folio" id="folio"></span></div>
      <div class="lineas" id="lineas"></div>
      <div class="pie">
        <div class="canal"><button data-canal="Mostrador" aria-pressed="true">Mostrador</button><button data-canal="Teléfono" aria-pressed="false">Teléfono / WhatsApp</button></div>
        <div class="tot"><span>Total</span><b id="total">$0</b></div>
        <button class="cobrar" id="cobrar" disabled>Cobrar</button>
        <button class="limpiar" id="limpiar">Vaciar venta</button>
      </div>
    </aside>
  </section>

  <section class="corte" id="pCorte" hidden></section>
</div>

<div class="veil" id="veil"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
// ============ Datos (los mismos precios de la página) ============
const SHEET_ID='1ih7P7BB9gkJPP0YDpSOQluiEVkKbgMtFrK_Clnch8uc';
const SABORES=[['adobado','Adobado'],['ajo','Ajo'],['chimichurri','Chimichurri'],['jalapeno','Jalapeño'],['chipotle','Chipotle'],['diabla','Diabla'],['habanero','Habanero'],['bbq','BBQ'],['teriyaki','Teriyaki'],['pina','Piña'],['tamarindo','Tamarindo']];
const REF=[['coca15','Coca-Cola'],['sidral15','Sidral']];
const CATS=[['pollos','Pollos'],['paquetes','Paquetes'],['carnes','Carnes'],['extras','Extras'],['bebidas','Bebidas']];
const M=[
 {id:'cuarto',c:'pollos',n:'1/4 Pollo',p:75,img:'cuarto',pz:['cuarto'],base:'pollo'},
 {id:'medio',c:'pollos',n:'1/2 Pollo',p:125,img:'medio',pz:['medio'],base:'pollo'},
 {id:'entero',c:'pollos',n:'1 Pollo',p:235,img:'entero',pz:['pollo'],base:'pollo'},
 {id:'p1',c:'paquetes',n:'Paquete 1',p:105,img:'p1',pz:['cuarto'],base:'pollo'},
 {id:'p2',c:'paquetes',n:'Paquete 2',p:149,img:'p2',pz:['medio'],base:'pollo'},
 {id:'p3',c:'paquetes',n:'Paquete 3',p:279,img:'p3',pz:['pollo'],ref:1,base:'pollo'},
 {id:'p4',c:'paquetes',n:'Paquete 4',p:365,img:'p4',pz:['pollo','medio'],base:'pollo'},
 {id:'p5',c:'paquetes',n:'Paquete 5',p:695,img:'p5',pz:['pollo','pollo','pollo'],ref:2,base:'pollo'},
 {id:'viernes',c:'paquetes',n:'Promo viernes',p:449,img:'viernes',pz:['pollo','pollo'],ref:1,base:'pollo'},
 {id:'costillas',c:'carnes',n:'Costillas',p:290,media:150,img:'costillas',extra:1},
 {id:'arrachera',c:'carnes',n:'Arrachera',p:320,media:160,img:'arrachera'},
 {id:'flautas',c:'extras',n:'Flautas',p:8,img:'flautas',nota:'5 por $35'},
 {id:'arroz',c:'extras',n:'Arroz',p:20,img:'arroz'},
 {id:'papas',c:'extras',n:'Papas',p:40,img:'papas'},
 {id:'sopa',c:'extras',n:'Sopa codito',p:40,img:'sopa'},
 {id:'ensalada',c:'extras',n:'Ensalada',p:20,img:'ensalada'},
 {id:'salsa',c:'extras',n:'Salsa',p:15,img:'salsa'},
 {id:'salsasabor',c:'extras',n:'Salsa sabor',p:25,img:'sabores',sab:1},
 {id:'refgrande',c:'bebidas',n:'Refresco 1.5 L',p:38,img:'coca15',ref:1},
 {id:'coca450',c:'bebidas',n:'Coca 450 ml',p:25,img:'coca450'},
];
const byId=id=>M.find(m=>m.id===id);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const money=n=>'$'+Math.round(n).toLocaleString('es-MX');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nomSab=k=>(SABORES.find(s=>s[0]===k)||[,k])[1];
const nomRef=k=>(REF.find(s=>s[0]===k)||[,k])[1];
const PZN={pollo:'Pollo',medio:'Medio',cuarto:'Cuarto'};
const OFF=new Set();

// ============ Estado (guardado solo en esta tablet, para la demo) ============
const LS='colorado-caja-demo';
let DB={folio:1,ventas:[]};
try{const g=JSON.parse(localStorage.getItem(LS)||'null'); if(g&&Array.isArray(g.ventas)) DB=g;}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(DB));}catch(e){}};
let cat='pollos', venta=[], canal='Mostrador';

const precioLinea=l=>{const m=byId(l.id);
  if(m.id==='flautas') return Math.floor(l.q/5)*35+(l.q%5)*8;
  let p=(l.media?m.media:m.p)*l.q; return p+((l.extras||[]).length)*25;};
const total=()=>venta.reduce((a,l)=>a+precioLinea(l),0);
function detalle(l){
  const m=byId(l.id), d=[];
  if(l.media!=null&&m.media) d.push(l.media?'Media orden':'Orden completa');
  (l.pzs||[]).forEach((p,i,a)=>{const n=a.filter(x=>x.t===p.t).length>1?' '+(a.slice(0,i+1).filter(x=>x.t===p.t).length):'';
    d.push(`${PZN[p.t]}${n}: ${p.modo==='mitad'&&p.s[1]!==p.s[0]?`½ ${nomSab(p.s[0])} y ½ ${nomSab(p.s[1])}`:nomSab(p.s[0])}${p.corte?' · '+p.corte:''}`);});
  if(l.refs) d.push('Refresco: '+l.refs.map(nomRef).join(', '));
  if(l.sabs) d.push('Sabores: '+l.sabs.map(nomSab).join(', '));
  if(l.extras&&l.extras.length) d.push('Sabor extra: '+l.extras.map(nomSab).join(', ')+` (+${money(l.extras.length*25)})`);
  if(m.id==='flautas'&&l.q>=5) d.push(`${Math.floor(l.q/5)} promo(s) de 5`);
  return d;
}

// ============ Pintar menú ============
function pintarCats(){

  $$('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;pintarCats();pintarGrid();});
}
function pintarGrid(){
  $('#grid').innerHTML=M.filter(m=>m.c===cat).map(m=>{
    const n=venta.filter(l=>l.id===m.id).reduce((a,l)=>a+l.q,0);
    const off=OFF.has(m.id)||(m.base&&OFF.has(m.base));
    return `<button class="prod ${off?'off':''}" data-p="${m.id}"><div class="ph" style="background-image:url(${m.img}.webp)"></div>
      <div class="t"><b>${esc(m.n)}</b><span>${money(m.p)}</span></div>${n?`<span class="cnt">${n}</span>`:''}</button>`;}).join('');

}
function pintarVenta(){
  $('#folio').textContent='Folio #'+String(DB.folio).padStart(4,'0');
  $('#lineas').innerHTML=venta.length?venta.map((l,i)=>{const m=byId(l.id);
    return `<div class="ln"><b>${l.q>1?l.q+' × ':''}${esc(m.n)}</b><span class="p">${money(precioLinea(l))}</span>
      ${detalle(l).map(t=>`<i>${esc(t)}</i>`).join('')}
      <div class="ctl"><button data-mn="${i}">−</button><span>${l.q}</span><button data-pl="${i}">+</button><button class="del" data-rm="${i}">Quitar</button></div></div>`;}).join('')
    :`<div class="vacio"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h2.2l2.3 10.4a1.6 1.6 0 0 0 1.6 1.3h7.7a1.6 1.6 0 0 0 1.5-1.1L20.5 8H6.1"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>Toca un producto para agregarlo a la venta.</div>`;
  $('#total').textContent=money(total());
  $('#cobrar').disabled=!venta.length;
  $$('[data-mn]').forEach(b=>b.onclick=()=>{const l=venta[+b.dataset.mn]; if(l.q>1){l.q--; if(l.pzs) l.pzs=ajustaPzs(byId(l.id),l.q,l.pzs);} else venta.splice(+b.dataset.mn,1); refrescar();});
  $$('[data-pl]').forEach(b=>b.onclick=()=>{const l=venta[+b.dataset.pl]; l.q++; if(l.pzs) l.pzs=ajustaPzs(byId(l.id),l.q,l.pzs); if(l.refs) l.refs=ajustaRefs(byId(l.id),l.q,l.refs); refrescar();});
  $$('[data-rm]').forEach(b=>b.onclick=()=>{venta.splice(+b.dataset.rm,1);refrescar();});
}
const refrescar=()=>{pintarGrid();pintarVenta();};
const ajustaPzs=(m,q,prev=[])=>{const t=[];for(let i=0;i<q;i++)t.push(...m.pz);return t.map((x,i)=>prev[i]&&prev[i].t===x?prev[i]:{t:x,modo:'completo',s:['adobado']});};
const ajustaRefs=(m,q,prev=[])=>{const n=(m.ref||0)*q,r=prev.slice(0,n);while(r.length<n)r.push('coca15');return r;};

// ============ Agregar producto (con opciones si aplica) ============
function abrir(html){$('#modal').innerHTML=html;$('#veil').classList.add('open');}
function cerrar(){$('#veil').classList.remove('open');}
$('#veil').onclick=e=>{if(e.target.id==='veil')cerrar();};
const X='<button class="x" id="cx" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';

function agregar(m){
  // Productos simples: se agregan con un toque
  if(!m.pz&&!m.media&&!m.ref&&!m.sab){const l=venta.find(x=>x.id===m.id); if(l) l.q++; else venta.push({id:m.id,q:1}); refrescar(); toast(`+1 ${m.n}`); return;}
  let q=1, media=false; let pzs=m.pz?ajustaPzs(m,1):null, refs=m.ref?ajustaRefs(m,1):null, sabs=m.sab?[]:null, extras=(m.pz||m.extra)?[]:null;
  const pinta=()=>{
    abrir(`<div class="modal-h"><h3>${esc(m.n)}</h3>${X}</div>
      ${m.media?`<span class="f">Tamaño</span><div class="chips"><button class="chip" data-md="0" aria-pressed="${!media}">Orden completa · ${money(m.p)}</button><button class="chip" data-md="1" aria-pressed="${media}">Media orden · ${money(m.media)}</button></div>`:''}
      ${m.sab?'':`<span class="f">Cantidad</span><div class="stepper"><button id="mn">−</button><span>${q}</span><button id="pl">+</button></div>`}
      ${pzs?pzs.map((p,i)=>`<div class="pieza"><div class="pieza-h"><span>${PZN[p.t]}${pzs.length>1?' '+(i+1):''}</span>${p.t==='pollo'?`<div class="modo"><button data-mo="completo" data-i="${i}" aria-pressed="${p.modo!=='mitad'}">Completo</button><button data-mo="mitad" data-i="${i}" aria-pressed="${p.modo==='mitad'}">Mitad y mitad</button></div>`:''}</div>
        ${p.modo==='mitad'?`<span class="mitad">1ª mitad</span>${filaSab(i,0,p)}<span class="mitad">2ª mitad</span>${filaSab(i,1,p)}`:filaSab(i,0,p)}
        ${p.t==='cuarto'?`<span class="mitad">Pieza</span><div class="chips">${['','Pierna y muslo','Ala y pechuga'].map(c=>`<button class="chip" data-co="${c}" data-i="${i}" aria-pressed="${(p.corte||'')===c}">${c||'Me da igual'}</button>`).join('')}</div>`:''}</div>`).join(''):''}
      ${refs?`<span class="f">Refresco${refs.length>1?'s':''}</span>${refs.map((r,i)=>`<div class="chips" style="margin-bottom:6px">${REF.map(([k,l])=>`<button class="chip" data-rf="${k}" data-i="${i}" aria-pressed="${r===k}">${l}</button>`).join('')}</div>`).join('')}`:''}
      ${extras?`<span class="f">¿Sabor extra? <small style="font-weight:500;color:var(--humo)">opcional · +$25 c/u</small></span><div class="chips">${SABORES.map(([k,l])=>`<button class="chip" data-ex="${k}" aria-pressed="${extras.includes(k)}" ${OFF.has('sab-'+k)?'disabled':''}>${l}</button>`).join('')}</div>`:''}
      ${sabs?`<span class="f">Sabores (toca para agregar)</span><div class="chips">${SABORES.map(([k,l])=>`<button class="chip" data-ss="${k}">${l}${sabs.filter(x=>x===k).length?' ×'+sabs.filter(x=>x===k).length:''}</button>`).join('')}</div>${sabs.length?'<button class="limpiar" id="ssClr" style="margin-top:8px">Borrar sabores</button>':''}`:''}
      <div class="acts"><button class="btn ghost" id="cancel">Cancelar</button><button class="btn main" id="ok" ${sabs&&!sabs.length?'disabled':''}>Agregar · ${money(precioLinea({id:m.id,q:sabs?sabs.length||1:q,media,extras}))}</button></div>`);
    $('#cx').onclick=cerrar; $('#cancel').onclick=cerrar;
    if($('#mn')){ $('#mn').onclick=()=>{if(q>1){q--; if(pzs)pzs=ajustaPzs(m,q,pzs); if(refs)refs=ajustaRefs(m,q,refs); pinta();}}; $('#pl').onclick=()=>{q++; if(pzs)pzs=ajustaPzs(m,q,pzs); if(refs)refs=ajustaRefs(m,q,refs); pinta();}; }
    $$('[data-md]').forEach(b=>b.onclick=()=>{media=b.dataset.md==='1';pinta();});
    $$('[data-mo]').forEach(b=>b.onclick=()=>{const p=pzs[+b.dataset.i];p.modo=b.dataset.mo;if(p.modo==='mitad'&&!p.s[1])p.s[1]=p.s[0];if(p.modo==='completo')p.s=[p.s[0]];pinta();});
    $$('[data-sb]').forEach(b=>b.onclick=()=>{pzs[+b.dataset.i].s[+b.dataset.h]=b.dataset.sb;pinta();});
    $$('[data-co]').forEach(b=>b.onclick=()=>{pzs[+b.dataset.i].corte=b.dataset.co;pinta();});
    $$('[data-rf]').forEach(b=>b.onclick=()=>{refs[+b.dataset.i]=b.dataset.rf;pinta();});
    $$('[data-ex]').forEach(b=>b.onclick=()=>{const k=b.dataset.ex,i=extras.indexOf(k); if(i<0) extras.push(k); else extras.splice(i,1); pinta();});
    $$('[data-ss]').forEach(b=>b.onclick=()=>{sabs.push(b.dataset.ss);pinta();});
    if($('#ssClr')) $('#ssClr').onclick=()=>{sabs.length=0;pinta();};
    $('#ok').onclick=()=>{venta.push({id:m.id,q:sabs?sabs.length:q,...(m.media?{media}:{}),...(pzs?{pzs}:{}),...(refs?{refs}:{}),...(sabs?{sabs:[...sabs]}:{}),...(extras&&extras.length?{extras:[...extras]}:{})}); cerrar(); refrescar(); toast(`Agregado: ${m.n}`);};
  };
  const filaSab=(i,h,p)=>`<div class="chips">${SABORES.map(([k,l])=>`<button class="chip" data-sb="${k}" data-i="${i}" data-h="${h}" aria-pressed="${p.s[h]===k}" ${OFF.has('sab-'+k)?'disabled':''}>${l}</button>`).join('')}</div>`;
  pinta();
}

      <div class="acts"><button class="btn ghost" id="cancel">Regresar</button><button class="btn verde" id="ok" ${forma==='Efectivo'&&recibe&&cambio<0?'disabled':''}>Confirmar venta</button></div>`);
    $('#cx').onclick=cerrar; $('#cancel').onclick=cerrar;
    $$('[data-fp]').forEach(b=>b.onclick=()=>{forma=b.dataset.fp;pinta();});

    if($('#recibe')) $('#recibe').oninput=e=>{recibe=+e.target.value||0; const c=recibe-t; const box=$('.cambio'); box.classList.toggle('falta',recibe&&c<0); box.querySelector('span').textContent=recibe&&c<0?'Falta':'Cambio'; box.querySelector('b').textContent=recibe?money(Math.abs(c)):'—'; $('#ok').disabled=!!(recibe&&c<0);};

      const v={folio:DB.folio,fecha:new Date().toISOString(),canal,forma,recibe:forma==='Efectivo'?(recibe||t):null,total:t,

    };
  };
  pinta();
}

function mostrarTicket(v){
  abrir(`<div class="modal-h"><h3>Venta registrada</h3>${X}</div>
    <p class="sub">Así saldría el ticket en la impresora térmica.</p>
    ${ticketHTML(v)}
    <div class="acts" style="margin-top:26px"><button class="btn ghost" id="imp">🖨 Imprimir ticket</button><button class="btn main" id="nueva">Nueva venta</button></div>`);
  $('#cx').onclick=cerrar; $('#nueva').onclick=cerrar;
  $('#imp').onclick=()=>toast('Aquí se enviará el ticket a la impresora térmica (se conecta en la versión final).');
}

// ============ Corte del día ============
function corte(){
  const hoy=new Date().toDateString();
  const vs=DB.ventas.filter(v=>new Date(v.fecha).toDateString()===hoy);
  const tot=vs.reduce((a,v)=>a+v.total,0);
  const por=f=>vs.filter(v=>v.forma===f).reduce((a,v)=>a+v.total,0);
  const formas=[['Efectivo',por('Efectivo'),'var(--verde)'],['Tarjeta',por('Tarjeta'),'var(--azul)'],['Transferencia',por('Transferencia'),'var(--ambar)']];
  const prod={}; vs.forEach(v=>v.lineas.forEach(l=>{prod[l.n]=prod[l.n]||{q:0,imp:0};prod[l.n].q+=l.q;prod[l.n].imp+=l.imp;}));
  const top=Object.entries(prod).sort((a,b)=>b[1].imp-a[1].imp).slice(0,6);
  const maxF=Math.max(1,...formas.map(f=>f[1])), maxP=Math.max(1,...top.map(p=>p[1].imp));
  $('#pCorte').innerHTML=`
    <div class="kpis">
      <div class="kpi"><span>Vendido hoy</span><b>${money(tot)}</b></div>
      <div class="kpi"><span>Ventas</span><b>${vs.length}</b></div>
      <div class="kpi"><span>Ticket promedio</span><b>${money(vs.length?tot/vs.length:0)}</b></div>
      <div class="kpi"><span>Efectivo en caja</span><b>${money(por('Efectivo'))}</b></div>
    </div>
    <div class="dos">
      <div class="caja"><h4>Por forma de pago</h4>${formas.map(([n,v,c])=>`<div class="barra"><span>${n}</span><div class="b"><i style="width:${v/maxF*100}%;background:${c}"></i></div><span class="v">${money(v)}</span></div>`).join('')}</div>
      <div class="caja"><h4>Lo más vendido</h4>${top.length?top.map(([n,p])=>`<div class="barra"><span>${esc(n)}</span><div class="b"><i style="width:${p.imp/maxP*100}%;background:var(--naranja)"></i></div><span class="v">${p.q} · ${money(p.imp)}</span></div>`).join(''):'<p class="sub">Aún no hay ventas hoy.</p>'}</div>
    </div>
    <div class="caja" style="margin-top:12px"><h4>Ventas de hoy</h4>
      ${vs.length?`<table><tr><th>Folio</th><th>Hora</th><th>Canal</th><th>Pago</th><th style="text-align:right">Total</th><th></th></tr>
      ${vs.slice().reverse().map(v=>`<tr><td>#${String(v.folio).padStart(4,'0')}</td><td>${new Date(v.fecha).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'})}</td><td><span class="tag">${v.canal}</span></td><td>${v.forma}</td><td style="text-align:right;font-weight:700">${money(v.total)}</td><td style="text-align:right"><button class="limpiar" data-vt="${v.folio}">Ver ticket</button></td></tr>`).join('')}</table>`:'<p class="sub">Cuando cobres una venta aparecerá aquí.</p>'}
      <div class="prox"><button id="pxSheets">📊 Guardar en Google Sheets</button><button id="pxCorte">🖨 Imprimir corte de caja</button><button id="pxReset">Borrar datos de la demo</button></div>
    </div>`;
  $$('[data-vt]').forEach(b=>b.onclick=()=>mostrarTicket(DB.ventas.find(v=>v.folio===+b.dataset.vt)));
  $('#pxSheets').onclick=()=>toast('En la versión final cada venta se guarda sola en la hoja de Google del negocio.');
  $('#pxCorte').onclick=()=>toast('En la versión final el corte se imprime en la impresora de tickets.');
  $('#pxReset').onclick=()=>{abrir(`<div class="modal-h"><h3>¿Borrar la demo?</h3>${X}</div><p class="sub">Se borran las ventas de prueba guardadas en esta tablet.</p><div class="acts"><button class="btn ghost" id="cancel">Cancelar</button><button class="btn main" id="ok">Sí, borrar</button></div>`);
    $('#cx').onclick=cerrar;$('#cancel').onclick=cerrar;$('#ok').onclick=()=>{DB={folio:1,ventas:[]};save();cerrar();corte();pintarVenta();};};
}

// ============ Navegación, reloj, agotados ============
function vista(v){ $('#vVenta').setAttribute('aria-pressed',v==='venta'); $('#vCorte').setAttribute('aria-pressed',v==='corte');
  $('#pVenta').hidden=v!=='venta'; $('#pCorte').hidden=v!=='corte'; if(v==='corte') corte(); }
$('#vVenta').onclick=()=>vista('venta'); $('#vCorte').onclick=()=>vista('corte');
$$('[data-canal]').forEach(b=>b.onclick=()=>{canal=b.dataset.canal;$$('[data-canal]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
$('#cobrar').onclick=cobrar;
$('#limpiar').onclick=()=>{venta=[];refrescar();};
let tt; function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('ver');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('ver'),2600);}
const tic=()=>{$('#reloj').textContent=new Date().toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit'});}; tic(); setInterval(tic,15000);
async function agotados(){ try{
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=Agotados&t=${Date.now()}`); if(!r.ok) return;
  const n=new Set(); (await r.text()).trim().split('\n').forEach(li=>{const [id,,a]=li.split(',').map(c=>c.replace(/^"|"$/g,'').trim()); if(id&&/^(true|verdadero|1)$/i.test(a)) n.add(id);});
  OFF.clear(); n.forEach(k=>OFF.add(k)); pintarGrid(); }catch(e){} }
pintarCats(); refrescar(); agotados(); setInterval(agotados,120000);
})();
</script>
